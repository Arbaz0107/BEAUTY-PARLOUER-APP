name: Build Naaz Makeup Studio Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Install Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp parlour_booking_hisab.html www/parlour_booking_hisab.html || true
          cp styles.css www/styles.css || true
          cp app.js www/app.js || true
          cp sw.js www/sw.js || true
          cp manifest.json www/manifest.json || true
          cp logo.png www/logo.png || true
          cp banner.jpg www/banner.jpg || true
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Naaz Makeup Studio" "com.naazmakeupstudio.app" --web-dir www
          fi

      - name: Add Android Platform & Sync Assets
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate & Apply Naaz Makeup Studio APK Launcher Icons
        run: |
          python3 -m pip install --upgrade Pillow || pip3 install Pillow
          python3 - << 'PYEOF'
          import os, re, base64
          from io import BytesIO
          from PIL import Image, ImageDraw

          # 1. Load logo.png if uploaded, OR extract embedded base64 logo directly from index.html
          logo_img = None
          if os.path.exists("logo.png"):
              try:
                  logo_img = Image.open("logo.png").convert("RGBA")
                  print("Loaded logo.png from repository root")
              except Exception as e:
                  print("Could not open logo.png:", e)

          if logo_img is None and os.path.exists("index.html"):
              html_text = open("index.html", "r", encoding="utf-8", errors="ignore").read()
              m = re.search(r'data:image/(?:jpeg|png);base64,([A-Za-z0-9+/=]+)', html_text)
              if m:
                  raw_bytes = base64.b64decode(m.group(1))
                  logo_img = Image.open(BytesIO(raw_bytes)).convert("RGBA")
                  logo_img.save("logo.png", format="PNG")
                  os.makedirs("www", exist_ok=True)
                  logo_img.save("www/logo.png", format="PNG")
                  print("Extracted embedded logo from index.html and saved to logo.png")

          if logo_img is None:
              raise RuntimeError("No logo found in logo.png or index.html!")

          res_dir = "android/app/src/main/res"

          # Remove default Capacitor vector drawables that override PNG mipmap icons
          for stale_vec in [
              os.path.join(res_dir, "drawable", "ic_launcher_background.xml"),
              os.path.join(res_dir, "drawable", "ic_launcher_foreground.xml"),
              os.path.join(res_dir, "drawable-v24", "ic_launcher_foreground.xml"),
          ]:
              if os.path.exists(stale_vec):
                  os.remove(stale_vec)
                  print("Removed default vector:", stale_vec)

          # Helper to create circular mask for ic_launcher_round.png
          def make_round_icon(img_rgba, size):
              resized = img_rgba.resize((size, size), Image.Resampling.LANCZOS)
              mask = Image.new("L", (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size - 1, size - 1), fill=255)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(resized, (0, 0), mask)
              return out

          # Helper to create Android Adaptive Icon foreground (108dp canvas with 72dp safe zone)
          def make_adaptive_foreground(img_rgba, fg_size):
              canvas = Image.new("RGBA", (fg_size, fg_size), (13, 11, 8, 255))
              # Place logo comfortably inside adaptive icon safe zone (~70% of 108dp)
              inner = int(round(fg_size * 0.70))
              resized = img_rgba.resize((inner, inner), Image.Resampling.LANCZOS)
              offset = (fg_size - inner) // 2
              canvas.paste(resized, (offset, offset), resized)
              return canvas

          mipmaps = {
              "mipmap-mdpi":    (48, 108),
              "mipmap-hdpi":    (72, 162),
              "mipmap-xhdpi":   (96, 216),
              "mipmap-xxhdpi":  (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }

          for folder, (icon_sz, fg_sz) in mipmaps.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)

              # Square/squircle legacy launcher icon
              sq = logo_img.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS)
              sq.save(os.path.join(target_dir, "ic_launcher.png"), format="PNG")

              # Round launcher icon
              rd = make_round_icon(logo_img, icon_sz)
              rd.save(os.path.join(target_dir, "ic_launcher_round.png"), format="PNG")

              # Adaptive launcher foreground icon
              fg = make_adaptive_foreground(logo_img, fg_sz)
              fg.save(os.path.join(target_dir, "ic_launcher_foreground.png"), format="PNG")

          # Set adaptive icon background color to Obsidian Black (#0D0B08)
          values_dir = os.path.join(res_dir, "values")
          os.makedirs(values_dir, exist_ok=True)
          bg_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0D0B08</color>
          </resources>
          '''
          with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w", encoding="utf-8") as f:
              f.write(bg_xml.strip() + "\n")

          # Ensure mipmap-anydpi-v26 adaptive XMLs point to @color/ic_launcher_background and @mipmap/ic_launcher_foreground
          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''
          for xml_name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              with open(os.path.join(anydpi_dir, xml_name), "w", encoding="utf-8") as f:
                  f.write(adaptive_xml.strip() + "\n")

          print("Successfully generated all Android APK launcher icons!")
          PYEOF

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Built Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naaz-Makeup-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
